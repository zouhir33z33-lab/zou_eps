name: eps_assistant_dz
description: "EPS Assistant DZ — مساعد أستاذ التربية البدنية والرياضية في الجزائر."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1      # إدارة الحالة
  sqflite: ^2.4.1               # قاعدة البيانات
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3    # الإعدادات + أول تشغيل + PIN
  crypto: ^3.0.6                # تجزئة PIN
  pdf: ^3.11.1                  # إنشاء PDF
  printing: ^5.13.4             # طباعة + مشاركة PDF
  file_picker: ^8.1.6           # استعادة نسخة احتياطية
  equatable: ^2.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
